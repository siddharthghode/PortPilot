[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot"
version = "0.1.0"
description = "Linux Port & Process Management CLI for Developers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "PortPilot Developers" }
]
keywords = ["linux", "port", "process", "developer-tools", "docker", "network", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
portpilot = "portpilot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portpilot*"]

[tool.setuptools.package-data]
portpilot = ["*.json", "data/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=portpilot --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["portpilot"]
branch = true
omit = [
    "tests/*",
    "portpilot/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
